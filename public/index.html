<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Посещаемость 9-В</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #737a87; --line: #e6e8ec;
  --ok: #16a34a; --ok-bg: #dcfce7; --bad: #dc2626; --bad-bg: #fee2e2; --accent: #2563eb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #8a92a0; --line: #272b33;
    --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1618; --accent: #60a5fa;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 18px; }
header .sub { color: var(--muted); font-size: 14px; }
.dots { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--card);
  color: var(--text); font-size: 24px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex: none;
  box-shadow: 0 0 0 1px var(--line); }
.back { border: 0; background: none; color: var(--accent); font-size: 16px; padding: 0; cursor: pointer; }

.stats { display: flex; gap: 10px; padding: 14px 16px 6px; }
.stat { flex: 1; border-radius: 14px; padding: 10px 14px; font-weight: 600; }
.stat b { font-size: 24px; display: block; }
.stat span { font-size: 13px; font-weight: 500; opacity: .85; }
.stat.ok { background: var(--ok-bg); color: var(--ok); }
.stat.bad { background: var(--bad-bg); color: var(--bad); }

.hint { color: var(--muted); font-size: 13px; padding: 4px 16px 10px; }
.list { margin: 0 16px; background: var(--card); border-radius: 16px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; width: 100%;
  border: 0; border-top: 1px solid var(--line); background: none; color: var(--text);
  font: inherit; text-align: left; cursor: pointer; }
.row:first-child { border-top: 0; }
.row .n { color: var(--muted); width: 24px; text-align: right; font-size: 14px; flex: none; }
.row .name { flex: 1; min-width: 0; }
.badge { flex: none; width: 40px; height: 32px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.row.present .badge { background: var(--ok-bg); color: var(--ok); }
.row.absent .badge { background: var(--bad-bg); color: var(--bad); }
.row.absent .name { color: var(--bad); }
.readonly .row { cursor: default; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent); }
.send { width: 100%; height: 54px; border: 0; border-radius: 16px; background: var(--accent);
  color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
.send:disabled { opacity: .55; }

.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45);
  display: none; }
.overlay.open { display: block; }
.sheet { position: absolute; right: 0; top: 0; bottom: 0; width: min(340px, 88vw);
  background: var(--card); padding: calc(16px + env(safe-area-inset-top, 0px)) 0 16px;
  overflow-y: auto; box-shadow: -4px 0 24px rgba(0,0,0,.25); }
.sheet h2 { margin: 0; padding: 4px 18px 12px; font-size: 18px; }
.item { display: block; width: 100%; border: 0; border-top: 1px solid var(--line);
  background: none; color: var(--text); font: inherit; font-size: 17px; text-align: left;
  padding: 15px 18px; cursor: pointer; }
.empty { color: var(--muted); padding: 10px 18px; }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  z-index: 20; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 12px;
  font-size: 15px; white-space: pre-wrap; display: none; }
.toast.show { display: block; }
.toast.err { background: var(--bad); color: #fff; }
</style>
</head>
<body>

<header>
  <div>
    <button class="back" id="back" hidden>← Назад</button>
    <h1 id="title">Посещаемость 9-В</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button class="dots" id="dots" aria-label="Все отчёты">⋮</button>
</header>

<div class="stats">
  <div class="stat ok"><b id="cOk">0</b><span>✅ Пришли</span></div>
  <div class="stat bad"><b id="cBad">0</b><span>Н  Не пришли</span></div>
</div>
<div class="hint" id="hint">Нажми на ученика, чтобы отметить «Н».</div>
<div class="list" id="list"></div>

<div class="bar" id="bar"><button class="send" id="send">Отправить</button></div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <h2>Все отчёты</h2>
    <div id="reports"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let pass = '';
try { pass = localStorage.getItem('pass') || ''; } catch (e) {}

let students = [];
let today = '';
let absent = new Set();
let viewing = null; // null — сегодняшний отчёт, иначе дата просматриваемого

const fmt = (iso) => iso.split('-').reverse().join('.');

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-pass': pass }
  });
  if (r.status === 401) {
    const p = prompt('Введите пароль');
    if (p === null) throw new Error('Нужен пароль');
    pass = p;
    try { localStorage.setItem('pass', pass); } catch (e) {}
    return api(path, opts);
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Ошибка');
  return data;
}

let toastTimer;
function toast(text, err) {
  const t = $('#toast');
  t.textContent = text;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, err ? 7000 : 2500);
}

function render() {
  const ro = viewing !== null;
  const list = $('#list');
  list.className = 'list' + (ro ? ' readonly' : '');
  list.textContent = '';
  students.forEach((name, i) => {
    const isAbsent = absent.has(name);
    const row = document.createElement('button');
    row.className = 'row ' + (isAbsent ? 'absent' : 'present');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = name;
    const b = document.createElement('span'); b.className = 'badge'; b.textContent = isAbsent ? 'Н' : '✅';
    row.append(n, nm, b);
    if (!ro) row.onclick = () => {
      if (absent.has(name)) absent.delete(name); else absent.add(name);
      render();
    };
    list.append(row);
  });
  $('#cBad').textContent = absent.size;
  $('#cOk').textContent = students.length - absent.size;

  $('#back').hidden = !ro;
  $('#title').hidden = ro;
  $('#sub').textContent = ro ? 'Отчёт ' + fmt(viewing) : fmt(today);
  $('#bar').hidden = ro;
  $('#hint').hidden = ro;
}

async function loadToday() {
  const d = await api('/api/init');
  students = d.students;
  today = d.today;
  absent = new Set(d.absent || []);
  viewing = null;
  render();
}

async function openMenu() {
  $('#overlay').classList.add('open');
  const box = $('#reports');
  box.textContent = '';
  try {
    const { dates } = await api('/api/reports');
    if (!dates.length) {
      const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Отчётов пока нет';
      box.append(e);
    }
    dates.forEach((d) => {
      const b = document.createElement('button');
      b.className = 'item';
      b.textContent = fmt(d) + '📍';
      b.onclick = () => openReport(d);
      box.append(b);
    });
  } catch (e) {
    const x = document.createElement('div'); x.className = 'empty'; x.textContent = e.message;
    box.append(x);
  }
}

function closeMenu() { $('#overlay').classList.remove('open'); }

async function openReport(d) {
  try {
    const r = await api('/api/report?date=' + d);
    students = r.students;
    absent = new Set(r.absent);
    viewing = d;
    closeMenu();
    render();
    window.scrollTo(0, 0);
  } catch (e) { toast(e.message, true); }
}

$('#dots').onclick = openMenu;
$('#overlay').onclick = (e) => { if (e.target === $('#overlay')) closeMenu(); };
$('#back').onclick = () => loadToday().catch((e) => toast(e.message, true));

$('#send').onclick = async () => {
  if (!confirm('Отправить отчёт за ' + fmt(today) + ' в группу?')) return;
  const btn = $('#send');
  btn.disabled = true; btn.textContent = 'Отправляю…';
  try {
    await api('/api/send', { method: 'POST', body: JSON.stringify({ absent: [...absent] }) });
    toast('Отчёт отправлен в группу ✅');
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Отправить';
  }
};

loadToday().catch((e) => toast(e.message, true));
</script>
</body>
</html>
